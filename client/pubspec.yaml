name: vault_client
description: "Bóveda de Contraseñas — Personal password vault client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ─── HTTP & environment ─────────────────────────────────────────────────
  dio: ^5.8.0
  flutter_dotenv: ^5.2.1

  # ─── State management ────────────────────────────────────────────────────
  provider: ^6.1.5

  # ─── Secure storage (session token in memory; Android Keystore on mobile)
  flutter_secure_storage: ^9.0.0

  # ─── UI ──────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
