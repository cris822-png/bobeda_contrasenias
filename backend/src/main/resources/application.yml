spring:
  application:
    name: vault-api

  # ─── DataSource ────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ─── JPA ───────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ─── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ─── Security: disable default form login page ─────────────
  security:
    user:
      name: disabled
      password: disabled # pragma: allowlist secret

# ─── Server ────────────────────────────────────────────────
server:
  port: ${API_PORT:8443}
  # For HTTPS in production, configure ssl.key-store etc.
  # For local dev the server listens on plain HTTP on the configured port.

# ─── JWT ────────────────────────────────────────────────────
vault:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:15}

# ─── Logging ────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.vault: DEBUG
    # IMPORTANT: Never set com.vault.api.crypto to TRACE or DEBUG in production.
    com.vault.api.crypto: INFO
  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
